# =============================================================================
#  ABOUT — sheet 01
# =============================================================================

# The large opening sentence.
lead: >-
  I've always been fascinated by what happens behind the curtain. While
  audiences remember the performance, I build the systems, schedules and
  collaborations that make those moments possible.

# Ordinary paragraphs. Add or remove "- >-" blocks to add or remove paragraphs.
body:
  - >-
    That curiosity has carried me through theatre, festivals and live
    productions, managing budgets and crews, coordinating collaborators, and
    making the hundred small decisions a project depends on. I enjoy working
    where creativity meets execution: taking an idea, figuring out what it needs
    to work, and bringing the right people and pieces together to make it happen.
  - >-
    I'm drawn to problems that need both a plan and quick thinking. A schedule
    that has to bend, a vendor that falls through two days out, a creative idea
    that needs a practical solution. That mix of structure, collaboration and
    improvisation is what keeps me motivated to build things and see them
    through.

# The boxed "At a glance" panel beside the text.
# `k` is the small label, `v` is the value. Add as many rows as you like.
facts:
  - k: Production Budgets
    v: "₹80L+"
  - k: Productions
    v: "100+"
  - k: Years
    v: "5+"
  - k: Crew Size
    v: 10–30

# The grid of competencies under the paragraphs. Keep this list short —
# it's meant to be scanned at a glance, not read as a full skill inventory.
owns:
  label: What I bring
  items:
    - Project Planning
    - Budget Management
    - Creative Problem-Solving
    - Designing
    - On-ground Execution
    - Technical Coordination
    - Stakeholder Management
    - Artist Relations

# The understated line at the very end of the section.
status: >-
  Currently freelancing across live entertainment and creative projects.
  Open to opportunities across entertainment, events, brands and operations.
