# =============================================================================
#  ABOUT — sheet 01
# =============================================================================

# The large opening sentence.
lead: >-
  I've always been fascinated by what happens behind the curtain. While
  audiences remember the performance, I build the systems, schedules and
  collaborations that make those moments possible.

# Ordinary paragraphs. Add or remove "- >-" blocks to add or remove paragraphs.
body:
  - >-
    That curiosity has carried me through theatre, festivals and large-scale
    live productions from managing budgets and crews to coordinating the
    hundred small decisions a show depends on. Production management, to me,
    sits exactly where creativity meets operations: the craft is in making
    the complicated look effortless.
  - >-
    I'm drawn to problems that need both a plan and quick thinking. A
    schedule that has to bend, a vendor that falls through two days out, a
    cue that has to land anyway. That mix of structure and improvisation is
    what keeps me motivated to do this work.

# The boxed "At a glance" panel beside the text.
# `k` is the small label, `v` is the value. Add as many rows as you like.
facts:
  - k: Production Budgets
    v: "₹50L+"
  - k: Productions
    v: "100+"
  - k: Years
    v: "5+"
  - k: Crew Size
    v: 10–30

# The grid of competencies under the paragraphs. Keep this list short —
# it's meant to be scanned at a glance, not read as a full skill inventory.
owns:
  label: What I own
  items:
    - Production Planning
    - Budgeting
    - Scheduling
    - Vendor Management
    - On-ground Execution
    - Technical Coordination
    - Stakeholder Management
    - Artist Relations

# The understated line at the very end of the section.
status: >-
  Currently freelancing as a Production Manager — open to opportunities
  across theatre, entertainment and live experiences.
