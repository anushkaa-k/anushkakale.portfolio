# The "From Script to Stage" pillars — the operational framework behind
# the production. Each one's supporting artifact (budget board,
# workflow diagram, stage layout, production workflow map) is built in
# code (see src/pages/FromScriptToStage.tsx); this is the prose half.
pillars:
  - title: Budgeting
    body: >-
      Alive's budget was built department by department, set design,
      projection, lighting, costumes, transport, hospitality, artist
      requirements, and technical equipment before a single rupee was
      committed. Instead of working with a broad estimate, I created
      detailed line-item budgets that reflected the actual production
      requirements.


      I sourced and compared multiple vendor quotations for each
      department, evaluating them not only on cost but also on quality,
      reliability, and their ability to deliver within the production
      timeline. Every quotation was reviewed against the creative brief
      and approved before procurement, ensuring financial decisions
      supported both the artistic vision and operational needs. In
      several cases, this meant negotiating scope adjustments rather
      than just price reductions to maintain quality within budget.


      Throughout pre-production and execution, I maintained a live
      budgeting worksheet that tracked committed costs, actual
      expenditure, and remaining balances in real time. This allowed the
      team to identify potential overruns early, make informed
      trade-offs, and avoid end-of-project financial surprises. It also
      became a shared reference point across departments, improving
      transparency and decision-making speed.


      Contingency funds were intentionally kept separate rather than
      absorbed into departmental allocations. This created flexibility
      to accommodate last-minute creative changes or operational
      challenges without disrupting other areas of the production.


      The biggest challenge wasn't simply staying under budget, it was
      balancing the creative ambition of a projection-heavy theatrical
      production with a fixed financial ceiling, ensuring that every
      spending decision delivered the highest possible impact on stage
      without compromising the overall vision.

  - title: Cross-city Coordination (Mumbai ↔ Pune)
    body: >-
      Alive was produced by NCPA's Mumbai team for a creative team based
      in Pune, so nothing about the production was in one room by
      default. Approvals, budgets, and schedules moved between cities
      constantly, and decisions made in Pune rehearsal rooms had to
      reach Mumbai fast enough to act on before load-in. I ran a
      standing communication line between both teams, coordinated
      payments and vendor approvals from Mumbai, and organised the
      transport of set, costume, and technical material between the two
      cities ahead of each milestone. Every handoff — a signed
      quotation, a revised blocking note, a changed call time — had an
      owner on both ends, so nothing sat waiting for someone to notice
      it. The job wasn't managing either city's production on its own;
      it was making sure neither team was ever the one waiting on
      information the other already had.

  - title: Technical Production
    body: >-
      Alive told much of its story through projection, which meant the
      technical plan had to treat projection cues with the same rigor as
      lighting and sound. I planned the projector position and
      projection surface alongside the lighting rig, mapped sightlines
      from the audience so nothing was lost to a blocked throw, and
      built a cue structure that synchronised projection, lighting, and
      performance beats into a single running order. Technical
      rehearsals were run specifically to drill that synchronisation
      rather than treat projection as a lighting afterthought — every
      cue called live, against a structure fixed during tech, not
      improvised on the day. The goal across every rehearsal was the
      same: a projection-heavy show has more that can go visibly wrong
      in performance than a conventional one, so execution had to be
      rehearsed until it was routine, not just possible.

  - title: Rehearsal & Production Planning
    body: >-
      Rehearsals were planned by working backward from opening night,
      creating a structured timeline that aligned venue availability,
      cast schedules, technical requirements, and department
      deliverables. Rather than treating rehearsals as isolated
      sessions, each phase was designed to build on the previous one,
      ensuring every team had the information and resources needed
      before moving forward.


      I developed detailed rehearsal schedules and daily production
      checklists that tracked the readiness of every department, from
      set installation and projection cues to lighting, costumes, props,
      and backstage operations. This reduced reliance on memory or
      verbal follow-ups, allowing progress to be monitored systematically
      throughout the rehearsal period. The checklists also made it easier
      to identify dependencies early, preventing small delays from
      cascading into larger production issues.


      Technical rehearsals, cue-to-cue runs, and dress rehearsals were
      intentionally spaced to provide adequate time for revisions and
      troubleshooting. This iterative approach significantly reduced
      opening-night risks and improved coordination across creative and
      technical teams. By opening night, readiness wasn't determined by
      a single final rehearsal, it was the outcome of weeks of
      structured planning, consistent tracking, and every checklist
      successfully cleared along the way.

# The Operations Takeaways cards — the closing section. Reflection on
# how the production was run, not a restatement of the metrics or
# journey above. `icon` picks one of a small fixed set of line icons
# drawn in code (see src/pages/OperationsTakeaways.tsx).
takeaways:
  - heading: Systems over firefighting
    icon: communication
    body: >-
      Planning communication flows before rehearsals reduced last-minute
      operational issues between Mumbai and Pune. A standing line
      between both teams meant approvals and changes had an owner on
      each end, rather than surfacing as a crisis on the day.

  - heading: Visibility creates better decisions
    icon: budget
    body: >-
      Maintaining live budget and schedule visibility allowed approvals,
      vendor payments, and procurement to happen without delaying
      rehearsals. Tracking expenses against a working worksheet through
      the run, not reconciling at the end, kept decisions ahead of the
      numbers rather than behind them.

  - heading: Technical planning begins early
    icon: workflow
    body: >-
      Projection-heavy productions require technical cues to be
      integrated during rehearsals, not added after blocking is
      complete. Treating projection with the same rigor as lighting and
      sound from the start meant synchronisation was rehearsed until it
      was routine, not discovered in tech.

  - heading: Creative teams need operational stability
    icon: checklist
    body: >-
      Reliable logistics, documentation, and scheduling allowed the
      creative team to focus on directing and performance instead of
      administration. A schedule built backward from opening night, with
      daily checklists tracking readiness, meant nothing depended on
      memory.

  - heading: Production scales through process
    icon: planning
    body: >-
      The same systems built for the festival premiere supported city
      tours and future performances with minimal operational changes.
      Because the structure carried the production rather than any one
      person's memory, it travelled with it.

