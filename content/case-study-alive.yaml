# =============================================================================
#  CASE STUDY — Alive
#
#  Renders as its own page (case-study-alive.html), linked from the
#  "View Case Study" button on this project's card in content/projects.yaml.
#
#  Alive is a narrative-style case study — a Project Overview paragraph
#  with a photograph and a row of Blueprint Metric spec cards, plus a
#  subway-style Production Lifecycle map, rather than the Executive
#  Dashboard used on the Vasant case study. Its schema is the same shared
#  caseStudySchema; it simply leaves the dashboard-only fields (context,
#  ownership, risks, execution, decisions) unset.
# =============================================================================

title: Alive
role: Assistant Production Manager
org: NCPA
year: 2025–26

# A single continuous paragraph — the story, not the scale. The scale
# figures live in `metrics` below instead, as a row of spec cards, so the
# paragraph isn't just restating every number. Kept tight on purpose: it
# shares its 40% of the viewport with the metrics row and a photograph,
# so there isn't room for a longer version alongside them.
overview: >-
  Alive began as the winning script in Darpan, NCPA's annual Marathi
  Scriptwriting Competition — an initiative created to discover, mentor,
  and produce original Marathi theatre. I led the competition's
  promotional and outreach efforts, then stayed on as the script moved
  into full-scale production. As Assistant Production Manager, I managed
  budgeting, production coordination, scheduling, and cross-city
  collaboration between the Mumbai-based NCPA and Pune-based creative
  teams, from rehearsal through opening night. Following its premiere at
  the Pratibimb Marathi Theatre Festival, Alive toured multiple cities,
  earned multiple Zee Natya Gaurav nominations, and was selected for the
  Bharat Rang Mahotsav — the National School of Drama's national
  festival. A competition script, now a nationally recognised production.

# The production photograph beside the overview paragraph. Reuses the
# same `poster` field the Vasant page uses for its schedule poster.
