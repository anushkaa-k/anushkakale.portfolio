# 2–3 short paragraphs — kept brief on purpose, so this fits one viewport
# alongside the poster.
context:
  - >-
    Vasant is NCPA's Gujarati theatre festival — four days of programming
    across four venues, with a full lineup of productions, readings and
    events running in parallel. As Assistant Production Manager, I owned
    day-to-day operations across the run: vendor coordination, crew
    scheduling, and keeping every show on its mark from load-in to curtain.
  - >-
    The scope sat across artist hospitality, front-of-house logistics,
    technical crew coordination and on-ground budget tracking — closer to
    running several small festivals inside one than a single production.
    Vendors, volunteers and visiting companies all needed one operational
    point of contact across the festival, and that was the role.

