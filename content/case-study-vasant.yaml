title: Vasant Gujarati Theatre Festival
role: Assistant Production Manager
org: NCPA
year: 2025 & 2026

# The Executive Dashboard tiles, left to right.
metrics:
  - k: Festival Duration
    v: 4 Days
  - k: Venues
    v: "5"
  - k: Productions
    v: 7+
  - k: Budget
    v: ₹30L+
  - k: Vendors
    v: 10+
  - k: Volunteers
    v: 30+
  - k: Crew
    v: 20+
  - k: Audience
    v: 1200+

# Project Context, as three short blueprint sections rather than free
# paragraphs — kept brief on purpose (~80-100 words total), so this fits
# one viewport alongside the poster.
context:
  - label: What It Is
    body: >-
      Vasant is NCPA's Gujarati Theatre Festival, four days of programming
      across five venues, with productions, readings, workshops and events running in
      parallel. I owned day-to-day operations across the run.
  - label: Scale
    body: >-
      Five venues, 7+ productions and 1200+ audience members across the
      run, coordinated with a crew of 50+ and 5+ volunteer assignments.
  - label: Operational Complexity
    body: >-
      The scope spanned artist hospitality, front-of-house logistics,
      technical crew coordination and on-ground budget tracking, closer
      to running several small festivals than one, with vendors,
      volunteers and companies all needing a single point of contact.

# Optional — delete this block, or leave `src` pointing at a file that
# doesn't exist yet, and the page shows a "poster pending" placeholder
# instead of a broken image.
poster:
  src: img/vasant-schedule-poster.jpg
  alt: Vasant Gujarati Theatre Festival — full festival schedule poster

# The Scope of Ownership modules, drawn clockwise from the top of the
# hub-and-spoke command map. Keywords, not sentences — 2-4 per module.
ownership:
  - domain: Production Planning
    keywords: [Scheduling, Run-of-show planning, Department coordination]
  - domain: Budget & Procurement
    keywords: [Budget tracking, Vendor quotations, Purchase orders, Reconciliation]
  - domain: Vendor Management
    keywords: [Fabricators, Rentals, Transport, Technical vendors]
  - domain: Artist & Hospitality
    keywords: [Travel, Accommodation, Backstage requirements, Green room coordination]
  - domain: Audience Experience
    keywords: [Entry flow, Installations, Photo opportunities, Wayfinding]
  - domain: Team Coordination
    keywords: [Volunteers, Technicians, Venue staff, Cross-department communication]

# The Project Complexity risk matrix cards. Numbered C-01, C-02... in
# code, in this array order.
risks:
  - item: Multiple Venues
    metric: 5 venues operating simultaneously
    note: >-
      Each venue had unique backstage layouts, technical setups, crew
      requirements and audience capacities, requiring separate operational
      planning despite running under one festival.
  - item: Parallel Productions
    metric: 8+ performances across 4 days
    note: >-
      Rehearsals, load-ins, changeovers and live performances frequently
      overlapped, meaning several production workflows were active at the
      same time.
  - item: Fixed Show Timings
    metric: Zero flexibility on curtain time
    note: >-
      Every production worked backwards from fixed performance slots.
      Delays in technical setup or rehearsals could not push audience-facing
      schedules.
  - item: Shared Resources
    metric: One resource, multiple dependencies
    note: >-
      Lighting equipment, sound systems, venue staff, volunteers and
      technical crews were shared across productions, creating constant
      scheduling dependencies.
  - item: Live Decision Making
    metric: Continuous operational changes
    note: >-
      Artist requests, venue constraints, schedule shifts and technical
      issues required rapid decisions while keeping performances and
      audience experience uninterrupted.
  - item: Interdependent Teams
    metric: 8+ volunteers and 9+ stakeholders
    note: >-
      Production teams, artists, venue management, technicians, vendors and
      front-of-house all depended on timely information and coordinated
      execution.

# The Execution Strategy bands — read as one continuous operations
# playbook, not five separate write-ups. Each band's supporting artifact is
# built in code (see src/pages/ExecutionStrategy.tsx); this is the prose
# half. `keyDecision` is the one-line orange-accented callout inside each
# band — kept short on purpose, distinct from the fuller Situation →
# Decision → Outcome cards in `decisions` below.
execution:
  - module: Production Planning
    objective: >-
      Five venues running in parallel needed one schedule, not five — built
      backward from fixed curtain times.
    checklist:
      - Built a master run-of-show across all five venues and four days
      - Locked load-in and tech slots first, fit rehearsals around fixed show times
      - Circulated one shared schedule, updated in real time as calls shifted
    keyDecision: >-
      One shared run-of-show instead of five separate venue schedules, a
      slip at one venue had a buffer to absorb into instead of cascading
      into the next call.

  - module: Technical Operations
    objective: >-
      Each venue arrived with a different rig, so technical plans were
      confirmed and adapted show by show, not assumed constant.
    checklist:
      - Ran a pre-show technical walkthrough at each venue
      - Maintained venue-specific cue sheets rather than one generic plan
      - Kept a single point of contact between visiting crews and the house team
    keyDecision: >-
      A pre-show walkthrough and a venue-specific cue sheet at every venue
      kept the audience-facing standard consistent despite four different
      rigs.

  - module: Volunteer Management
    objective: >-
      8+ volunteers covering four venues across four days needed fixed
      zones, not floating coverage.
    checklist:
      - Assigned volunteers to fixed zones and shifts rather than floating coverage
      - Ran a role-specific briefing before every shift
      - Set one escalation contact per shift
    keyDecision: >-
      One named escalation contact per shift meant issues were resolved at
      the shift level, not routed back to a single point.

  - module: Artist Coordination & Hospitality
    objective: >-
      Company sizes ranged from a single performer to twenty-five, so
      hospitality was sized to each company, not templated.
    checklist:
      - Confirmed hospitality requirements with each company ahead of their show date
      - Sized green room, catering and transport arrangements individually
      - Assigned one hospitality point of contact per company
    keyDecision: >-
      A hospitality checklist that scaled to company size, confirmed ahead
      of the show date, nothing scrambled together on the day regardless
      of group size.

  - module: Audience Experience
    objective: >-
      House readiness had to be consistent at every venue, every day,
      regardless of who was performing.
    checklist:
      - Ran a standardised front-of-house checklist before every curtain
      - Briefed house staff on venue-specific entry, seating and interval flow
      - Checked signage and wayfinding at each venue individually
    keyDecision: >-
      One standardised front-of-house checklist run at every venue kept the
      audience's first impression consistent regardless of venue or day.

# The Operational Decisions cards — an executive-level closing review,
# three decisions read as Challenge → Decision → Impact rather than four
# retellings of execution tasks (Artist Hospitality already has its own
# card in Execution Strategy, so it's dropped here to avoid repeating
# it). Each one's supporting visual is built in code (see
# src/pages/OperationalDecisions.tsx); this is the prose half. `impact`
# is 2–3 short, measurable bullets, not a paragraph.
decisions:
  - title: Multi-Venue Scheduling
    metric: 5 Venues · 4 Days
    challenge: >-
      Five venues, four fixed curtain times, almost no slack to absorb
      a slip at any one of them.
    decision: >-
      Built one shared run-of-show instead of four separate venue
      schedules, with a buffered changeover window held between every
      call.
    impact:
      - Zero scheduling collisions across the four-day run
      - Slips absorbed by buffer windows, not cascaded downstream
      - One shared schedule, not four, as the single source of truth

  - title: Volunteer Deployment
    metric: 8+ Volunteers
    challenge: >-
      8+ volunteers across four venues and four days, too many shifts
      for one supervisor to watch.
    decision: >-
      Assigned volunteers to fixed zones and shifts, with one named
      escalation contact per shift instead of one central point.
    impact:
      - Shift-level issues resolved at the shift level
      - Coverage gaps caught and filled without a festival-wide fix
      - One escalation contact named for every shift, every zone

  - title: Technical Coordination
    metric: 100+ Technical Cues
    challenge: >-
      Four venues, four different rigs, no single technical plan
      could be assumed to carry over.
    decision: >-
      Ran a pre-show walkthrough at every venue and kept a
      venue-specific cue sheet instead of one standard technical plan.
    impact:
      - One consistent technical standard held across all four venues
      - 100+ cues run cleanly despite four different rigs
      - No rig ever assumed to carry over between venues
