# The Ownership Matrix cards, and the labels on the hub-and-spoke diagram
# beside them (in the same order they're drawn, clockwise from the top).
ownership:
  - domain: Production Planning
    summary: >-
      Owned festival scheduling, run-of-show sequencing and pre-production
      timelines across all four venues.
  - domain: Technical Operations
    summary: >-
      Coordinated lighting, sound and stage crews, and resolved technical
      variability show to show.
  - domain: Venue Operations
    summary: >-
      Managed load-in, load-out and front-of-house readiness, and venue
      handover across the run.
  - domain: Volunteer Management
    summary: >-
      Recruited, briefed and deployed 30+ volunteer assignments across
      venues and shifts.
  - domain: Artist Hospitality
    summary: >-
      Primary point of contact for visiting artists and companies, from
      green room to show-day needs.
  - domain: Audience Experience
    summary: >-
      Owned house management and front-of-house presentation for every
      performance.
  - domain: Production Documentation
    summary: >-
      Maintained run sheets, contact lists and post-show reports across
      the festival.

# The Operations Risk Register rows, and the input labels on the
# convergence diagram beside it.
risks:
  - item: Multi-Venue Operations (4 Venues)
    impact: Crew and resources split across sites running in parallel.
    mitigation: Dedicated venue leads with a shared run-of-show and live status updates.
  - item: Technical Variability
    impact: Each venue's rig, acoustics and capabilities differ show to show.
    mitigation: Pre-show technical walkthroughs and venue-specific cue sheets.
  - item: Fixed Show Timings
    impact: Little to no slack between back-to-back performances.
    mitigation: Buffered changeover windows and a strict call-time schedule.
  - item: Volunteer Deployment (30+ Assignments)
    impact: Large, rotating team with variable experience levels.
    mitigation: Role-based briefings and a single point of escalation per shift.
  - item: Artist Hospitality (1–25 Performers)
    impact: Company sizes swing widely between productions.
    mitigation: A scalable hospitality checklist sized to each company in advance.
  - item: Audience Experience
    impact: House readiness shapes the first impression of every show.
    mitigation: A standardised front-of-house checklist run before every curtain.

# The Execution Strategy modules — how each area actually ran, not what it
# was responsible for. Each module's supporting artifact is built in code
# (see src/pages/ExecutionStrategy.tsx); this is the prose half.
execution:
  - module: Production Planning
    objective: >-
      Every festival day ran across multiple venues with back-to-back calls,
      so the plan had to sequence load-in, tech and performance windows
      without collision. The schedule was built backward from fixed curtain
      times and held as the single source of truth for every department.
    checklist:
      - Built a master run-of-show mapping every venue, call time and changeover window across all four days
      - Locked load-in and tech slots first, then fit rehearsals and briefings around fixed show times
      - Circulated one shared schedule to all departments, updated in real time as calls shifted
      - Flagged conflicts — double-booked crew, tight changeovers — during planning, not on the day

  - module: Technical Operations
    objective: >-
      Each venue arrived with a different rig, so technical requirements had
      to be confirmed and adapted show by show rather than assumed constant.
      The goal was a consistent audience experience despite that
      variability.
    checklist:
      - Ran a pre-show technical walkthrough at each venue ahead of its first performance
      - Maintained venue-specific cue sheets rather than one generic technical plan
      - Kept a single point of contact between visiting technical crews and the house team
      - Built buffer time into every changeover for equipment checks before doors

  - module: Volunteer Operations
    objective: >-
      30+ volunteer assignments had to cover four venues across four days
      with people of varying experience, so deployment needed structure
      rather than ad hoc assignment. Every volunteer needed a clear role and
      a clear person to ask.
    checklist:
      - Assigned volunteers to fixed zones and shifts rather than floating coverage
      - Ran a role-specific briefing before each shift, not one festival-wide briefing
      - Set one escalation contact per shift so issues didn't wait for a festival-wide fix
      - Tracked shift coverage against a live allocation sheet, adjusted as gaps appeared

  - module: Artist Coordination & Hospitality
    objective: >-
      Company sizes ranged from a single performer to twenty-five, so
      hospitality couldn't follow one fixed template. Each visiting artist
      or company needed their specific needs confirmed before they arrived,
      not discovered on the day.
    checklist:
      - Confirmed hospitality requirements with each company ahead of their show date
      - Sized green room, catering and transport arrangements to each company individually
      - Assigned one hospitality point of contact per company for the length of their stay
      - Held a standing checklist scaled up or down by group size rather than rebuilt each time

  - module: Audience Experience
    objective: >-
      House readiness shaped the first impression of every performance, so
      front-of-house had to be consistent regardless of venue or day. The
      goal was a predictable audience journey from arrival to their seat.
    checklist:
      - Ran a standardised front-of-house checklist before every curtain, at every venue
      - Briefed house staff on venue-specific entry, seating and interval flow ahead of each show
      - Coordinated ticketing and house opening times against the master schedule
      - Checked signage and wayfinding at each venue rather than assuming carryover from the last

# The Operational Decisions cards — Situation → Decision → Outcome. Each
# one's supporting visual is built in code (see
# src/pages/OperationalDecisions.tsx); this is the prose half.
decisions:
  - title: Multi-Venue Scheduling
    metric: 4 Venues · 4 Days
    situation: >-
      Four venues ran in parallel across four days, each with its own
      load-in and tech window feeding into a fixed curtain time — with
      almost no slack to absorb a slip at any one of them.
    decision: >-
      Built one shared run-of-show instead of four separate venue
      schedules, sequencing load-in and tech first and holding a buffered
      changeover window between every call rather than assuming the
      previous one would land on time.
    outcome: >-
      No scheduling collisions across the four-day run — a slip at one
      venue had a buffer to absorb into instead of cascading into the
      next call.

  - title: Volunteer Deployment
    metric: 30+ Assignments
    situation: >-
      30+ volunteer assignments had to cover four venues across four
      days, with experience levels varying widely across the team and no
      single supervisor able to watch every shift at once.
    decision: >-
      Assigned volunteers to fixed zones and shifts rather than floating
      general coverage, and gave every shift one named escalation
      contact instead of routing every issue back to a single point.
    outcome: >-
      Shift-level issues were resolved at the shift level — coverage
      gaps got caught and filled without needing a festival-wide fix
      each time.

  - title: Technical Coordination
    metric: 4 Distinct Rigs
    situation: >-
      Each venue arrived with a different rig, acoustic profile and
      crew, so a technical plan written for one venue couldn't be
      assumed to hold at the next.
    decision: >-
      Ran a pre-show technical walkthrough at every venue ahead of its
      first performance and kept a venue-specific cue sheet for each,
      instead of one standard technical plan applied everywhere.
    outcome: >-
      A consistent audience-facing technical standard held across all
      four venues, despite none of them sharing the same rig.

  - title: Artist Hospitality
    metric: 1–25 Performers
    situation: >-
      Visiting companies ranged from a single performer to twenty-five,
      so a fixed hospitality template would either overprovision small
      companies or fall short for large ones.
    decision: >-
      Built a hospitality checklist that scaled to each company's size,
      confirmed with them ahead of their show date rather than applying
      one fixed plan across every production.
    outcome: >-
      Every company's hospitality needs were sized correctly in advance
      — nothing scrambled together on the day regardless of group size.
