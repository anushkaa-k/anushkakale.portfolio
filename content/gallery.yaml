# =============================================================================
#  GALLERY — the festival photographs
#
#  This sheet stays hidden until at least one photo is listed below, so the
#  site looks finished while the pictures are still being gathered.
#
#  HOW TO ADD PHOTOS
#  1. Put the image files into the folder  public/img/
#  2. Add a "- src:" block below and change the filename to match.
#
#  `src`      the filename, written as  img/your-file-name.jpeg
#  `alt`      describes the picture for screen readers, and is also the full
#             caption shown in the lightbox — write it in full, it is never
#             truncated on screen.
#  `project`  the filter-tab bucket: a festival name, or "Behind the Scenes"
#             for everything else (crew, other productions, workshops).
#  `title`    a short title shown on hover and in the lightbox.
#  `year`     optional — leave it out rather than guess.
#  `location` optional — leave it out rather than guess.
#
#  A photo that is listed but missing from public/img/ quietly drops out, so a
#  typo can never leave a broken image on the page.
# =============================================================================

