# =============================================================================
#  PROJECTS — sheet 02
#
#  Each "- title:" block below is one card. To add a project, copy an entire
#  block (from "- title:" down to its last line), paste it, and edit it.
#
#  Order matters: the first two cards show as Featured Case Studies (a
#  bigger CTA, a heavier frame, plus an optional second "instagram" CTA);
#  everything after that shows as a Supporting Production (understated,
#  a plain outbound "link"). Put the two you want leading the sheet first.
# =============================================================================

